# Auto-deploy the V2 preview.
#
# Until now every V2 change needed a manual dance: build --v2, checkout main,
# copy the generated v2/ over, commit, push. Five steps, easy to forget, and the
# published preview drifted behind the branch. This does it on every push to v2.
#
# What it does NOT do: touch the root. V1 stays exactly where it is — the whole
# point of /v2/ is that a service worker has no rollback, so the version people
# have installed is never overwritten by a preview.
name: Deploy V2 preview

on:
  push:
    branches: [v2]
  workflow_dispatch:        # lets you re-publish by hand from the Actions tab

permissions:
  contents: write

concurrency:                # a fast second push should not race the first
  group: deploy-v2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: v2, fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }

      - run: npm ci

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1

      # Never publish a preview that fails its own tests.
      - name: Build + test
        run: |
          npm run build
          node test/ci-tests.mjs
          node test/smoke-controls.mjs
        env:
          PW_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Build V2 bundle
        run: node build.js --v2

      - name: Publish v2/ to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp -r v2 /tmp/v2-build
          # v2/ is tracked on this branch too, so the fresh build leaves the tree
          # dirty and a plain checkout refuses to switch. The build is already
          # safe in /tmp — discard the working copy.
          git checkout -f main
          git clean -fd v2
          git pull --rebase origin main
          rm -rf v2 && cp -r /tmp/v2-build v2
          if git diff --quiet -- v2; then
            echo "v2/ sin cambios — nada que publicar"
            exit 0
          fi
          git add v2
          git commit \
            -m "chore(v2): auto-publish preview from ${GITHUB_SHA::7}" \
            -m "Generated by .github/workflows/deploy-v2.yml. Root (V1) untouched."
          git push origin main
